<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F4F8;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 300px;
            background-color: #E7F3F9;
            border: 2px solid #5A9BD5;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .container h1 {
            margin-top: 0;
            font-size: 24px;
            color: #0073A6;
        }
        .container ul {
            list-style-type: none;
            padding-left: 20px;
        }
        .container li {
            margin-bottom: 10px;
            font-size: 14px;
            color: #333;
        }
        .legend {
            margin-top: 20px;
            font-size: 14px;
        }
        .legend span {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #009933;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Jasper Court</h1>
        <p>For scenario:</p>
        <ul>
            <li>i. 19<sup>th</sup> Highest Hourly NO2;</li>
            <li>ii. Annual NO2;</li>
            <li>iii. 10<sup>th</sup> Highest Daily RSP;</li>
            <li>iv. Annual RSP;</li>
            <li>v. 19<sup>th</sup> Highest Daily FSP;</li>
            <li>vi. Annual FSP</li>
        </ul>
        <div class="legend">
            <span></span> In compliance with Hong Kong Air Quality Objectives (AQOs)
        </div>
    </div>
</body>
</html>
