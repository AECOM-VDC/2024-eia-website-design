<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noise Legend</title>
    <link rel="preload" href="../../data/noise/noise.json" as="fetch" crossorigin>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        
        .legend-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }
        
        .legend-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0;
            width: 100%;
            height: 100%;
            opacity: 1;
            transition: opacity 0.3s ease-in-out;
            background-color: transparent;
        }
        
        .legend-grid.fading-out {
            opacity: 0;
        }
        
        .legend-grid.fading-in {
            opacity: 1;
        }
        
        .legend-cell {
            width: 100%;
            border: none;
            box-sizing: border-box;
        }
        
        .color-0 {
            background-color: #ff0000; /* Red */
        }
        
        .color-1 {
            background-color: #00ff00; /* Green */
        }
        
        .color-2 {
            background-color: #0000ff; 
        }
        
        .hidden {
            display: none;
        }
        
        .error {
            color: red;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="legend-container">
        <div id="legend-grid" class="legend-grid"></div>
        <div id="error-message" class="error hidden"></div>
    </div>

    <script>
        // Cache DOM elements and parse URL immediately
        const legendGrid = document.getElementById('legend-grid');
        const errorMessage = document.getElementById('error-message');
        const urlParams = new URLSearchParams(window.location.search);
        const currentId = urlParams.get('id');
        
        // Global variables
        let noiseData = null;
        let currentScenario = 'mitigated'; // default
        let isTransitioning = false; // Prevent multiple simultaneous transitions
        
        // Color mapping
        const colorClasses = {
            0: 'color-0', // Red
            1: 'color-1', // Green
            2: 'color-2'  // Blue
        };
        
        // Load JSON data with early validation
        async function loadNoiseData() {
            if (!currentId) {
                showError('No ID parameter provided in URL. Please add ?id=YOUR_ID to the URL.');
                return false;
            }
            
            try {
                const response = await fetch('../../data/noise/noise.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                noiseData = await response.json();
                return true;
            } catch (error) {
                console.error('Error loading noise data:', error);
                showError('Failed to load noise data');
                return false;
            }
        }
        
        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
            legendGrid.classList.add('hidden');
        }
        
        // Hide error message
        function hideError() {
            errorMessage.classList.add('hidden');
            legendGrid.classList.remove('hidden');
        }
        
        // Find noise data by ID
        function findNoiseDataById(id) {
            if (!noiseData || !noiseData.noise) {
                return null;
            }
            return noiseData.noise.find(item => item.id === id);
        }
        
        // Render legend grid with optimized DOM operations
        function renderLegend() {
            const data = findNoiseDataById(currentId);
            if (!data) {
                showError(`No data found for ID: ${currentId}`);
                return;
            }
            
            const scenarios = data.scenarios[currentScenario];
            if (!scenarios) {
                showError(`No ${currentScenario} scenario found for ID: ${currentId}`);
                return;
            }
            
            hideError();
            
            // Use DocumentFragment for efficient DOM updates
            const fragment = document.createDocumentFragment();
            const reversedScenarios = [...scenarios].reverse();
            
            // Set grid template rows to distribute height equally
            const gridRows = reversedScenarios.map(() => '1fr').join(' ');
            legendGrid.style.gridTemplateRows = gridRows;
            
            // Create all cells in memory first
            reversedScenarios.forEach((colorCode, index) => {
                const cell = document.createElement('div');
                cell.className = `legend-cell ${colorClasses[colorCode] || ''}`;
                cell.setAttribute('data-index', scenarios.length - 1 - index);
                cell.setAttribute('data-color', colorCode);
                fragment.appendChild(cell);
            });
            
            // Single DOM update - much faster than individual appendChild calls
            legendGrid.innerHTML = '';
            legendGrid.appendChild(fragment);
        }
        
        // Handle scenario change events with fade transition
        async function handleScenarioChange(scenario) {
            if (scenario !== 'mitigated' && scenario !== 'unmitigated') {
                return;
            }
            
            // Prevent multiple simultaneous transitions
            if (isTransitioning) {
                return;
            }
            
            // If scenario hasn't changed, still do the fade effect for visual feedback
            const scenarioChanged = currentScenario !== scenario;
            currentScenario = scenario;
            
            isTransitioning = true;
            
            try {
                // Phase 1: Fade out current legend
                legendGrid.classList.add('fading-out');
                legendGrid.classList.remove('fading-in');
                
                // Wait for fade out to complete
                await new Promise(resolve => setTimeout(resolve, 300));
                
                // Phase 2: Update legend content while invisible
                renderLegend();
                
                // Phase 3: Fade in new legend
                legendGrid.classList.remove('fading-out');
                legendGrid.classList.add('fading-in');
                
                // Wait for fade in to complete
                await new Promise(resolve => setTimeout(resolve, 300));
                
                // Clean up classes
                legendGrid.classList.remove('fading-in');
                
            } finally {
                isTransitioning = false;
            }
        }
        
        // Listen for messages from parent window
        window.addEventListener('message', function(event) {
            if (event.data === 'mitigated' || event.data === 'unmitigated') {
                handleScenarioChange(event.data);
            }
        });
        
        // Initialize immediately - no need to wait for DOMContentLoaded
        (async function init() {
            // Load noise data (includes ID validation)
            const dataLoaded = await loadNoiseData();
            if (!dataLoaded) {
                return;
            }
            
            // Initial render
            renderLegend();
        })();
    </script>
</body>
</html>
