<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual Compare</title>
    <!-- don't need fontawesome if tooltip is not used -->
    <link rel="stylesheet" href="./lib/fontawesome/css/all.css" />
    <!-- <script src="./lib/vue.global.js"></script> -->
    <script src="./lib/vue.global.prod.js"></script>
    <!-- <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    /> -->
    <!-- <meta http-equiv="Pragma" content="no-cache" /> -->
    <!-- <meta http-equiv="Expires" content="0" /> -->

    <script src="./lib/image-compare-viewer.min.js"></script>
    <link rel="stylesheet" href="./lib/image-compare-viewer.min.css" />
    <!-- <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script> -->

    <script src="./js/page.js?v=1.0.7"></script>

    <link
      rel="stylesheet"
      href="./lib/bootstrap-5.1.3-dist/css/bootstrap.min.css"
    />
    <script src="./lib/bootstrap-5.1.3-dist/js/bootstrap.bundle.min.js"></script>
    <style>
      img {
        max-width: 100%;

        max-height: 100%;
      }
      body {
        background-color: transparent !important;
        /* background-color: #000000 !important; */
      }

      * {
        /* overwites default bootstrap behavior */
        /* margin: 0 !important; */
        /* padding: 0 !important; */
      }
      .dropdown-menu {
        /* position: relative;
        left: 50% !important;
        transform: translate(-50%, 100%) !important; */
      }

      .abs-x-center {
        /* right: auto !important; */
        left: 50% !important;
        /* -webkit-transform: translate(-50%, 0) !important; */
        /* -o-transform: translate(-50%, 0) !important; */
        transform: translateX(-50%) !important;
      }

      #dropdownA .dropdown-item.active::after {
        content: " [right]";
      }

      #dropdownB .dropdown-item.active::after {
        content: " [left]";
      }

      #dropdownA .dropdown-item.disabled::after {
        content: " [left]";
      }

      #dropdownB .dropdown-item.disabled::after {
        content: " [right]";
      }

      .dropdown-item:focus {
        color: #fff;
        background-color: #008768;
        border-color: #fff;
      }

      .dropdown-item.active {
        color: #008768;
        background-color: #ffffff;
        border-color: #008768;
      }

      .dropdown-item.disabled {
        color: #fff;
        background-color: #008768;
        border-color: #fff;
      }

      .dropdown-item:focus {
        color: #fff;
        background-color: #008768;
        border-color: #fff;
      }

      .sidebar.collapse.show,
      .sidebar.collapse.show + .col {
        transition: 0.18s linear !important;
        left: 0;
      }

      .sidebar.collapse,
      .sidebar.collapsing,
      .sidebar.collapsing + .col {
        transition: 0.18s linear !important;
        z-index: 1050;
        left: -25%;
        /* height: auto !important; */
      }

      .btn:focus,
      .btn:active {
        outline: none !important;
        box-shadow: none;
      }

      .list-group-item {
        background-color: transparent !important;
      }

      /* make sidebar scrollable and rounded */
      .sidebar .scroll {
        overflow: auto !important;
        max-height: 90vh !important;
        border-radius: 0.25rem !important;
        scrollbar-color: grey transparent !important;
      }

      /* make scrollbar rounded */
      .sidebar .scroll::-webkit-scrollbar {
        width: 0.5rem !important;
      }

      /* make scrollbar color grey */
      .sidebar .scroll::-webkit-scrollbar-track {
        background-color: transparent !important;
      }

      /* make scrollbar color thumb grey */
      .sidebar .scroll::-webkit-scrollbar-thumb {
        background-color: grey !important;
      }

      /* make scrollbar compatible on Firefox */
      .sidebar .scroll {
        scrollbar-width: thin !important;
        scrollbar-color: grey transparent !important;
      }

      #image-compare {
        /* object-fit: fill; */

        /* object-fit: contain; */
        min-height: 0 !important;
        max-height: 100% !important;
      }

      img {
        /* object-fit:cover !important; */
        /* width: 100% !important; */
      }

      #imageRow {
        min-height: 0 !important;
      }

      .tooltip-inner {
        background-color: #008768;
      }

      .tooltip-arrow::before {
        border-left-color: #008768 !important;
      }
      [v-cloak] {
        display: none !important;
      }

      .title {
        font-size: 1.5rem !important;
      }
      @media screen and (min-width: 575px) {
        .title {
          font-size: 2rem !important;
        }
      }

      .items {
        font-size: 10px !important;
        padding-left: 5px !important;
        padding-right: 5px !important;
      }
      @media screen and (min-width: 575px) {
        .items {
          font-size: 16px !important;
          padding-left: 15px !important;
          padding-right: 15px !important;
        }
      }

      .sidebar.mobile {
        overflow: auto !important;
        max-height: max-content !important;
      }
    </style>
  </head>
  <body>
    <div id="app" class="container-fluid vh-100 overflow-hidden" id="panel">
      <div id="main" class="row justify-content-center h-100">
        <!-- mitigation measures -->
        <div
          id="collapse-left"
          class="col-sm-4 sidebar collapse collapse-horizontal p-0 pe-3"
          data-bs-parent="#main"
        >
          <div class="scroll w-100 pt-0 vh-100 rounded mt-5">
            <table class="table rounded mb-0">
              <thead class="rounded">
                <tr class="table-dark" style="white-space: nowrap">
                  <th scope="col">ID No.</th>
                  <th scope="col">Landscape and Visual Mitigation</th>
                </tr>
              </thead>
              <tbody class="table-light">
                <!-- if item.color is 1 -->
                <tr
                  v-cloak
                  v-for="(item, index) in items"
                  :key="index"
                  :class="{'table-secondary': item.color === 1}"
                >
                  <th :class="{'text-center': item.color === 1}">
                    {{item.title}}
                  </th>
                  <td>{{item.content}}</td>
                </tr>
              </tbody>
            </table>
            <p class="h6 p-3 bg-light m-0">
              Note: 
            </p>
          </div>
        </div>
        <div
          id="compare"
          class="col-sm-7 col-12 d-flex flex-column"
          style="max-height: 100vh"
        >
          <div class="row justify-content-between my-2" id="titleBar">
            <div
              id="sideToggle"
              class="col-2 col-sm-3 text-light align-middle align-self-center"
              data-bs-toggle="tooltip"
              data-bs-placement="left"
              title=""
            >
            <!-- 上面title是tooltip顯示內容 拿掉了 -->
              <a
                data-bs-toggle="collapse"
                href="#"
                data-bs-target="#collapse-left"
                role="button"
                class="text-light text-center align-baseline align-self-center h6 p-0 d-none d-sm-inline"
                style="text-decoration: none; display: none !important;"
              >
                <i class="fa-solid fa-chevron-left"></i>
                Mitigation Measures
              </a>
            </div>

            <div
              v-cloak
              class="title col-8 col-sm-6 text-center py-0 text-light align-middle align-self-center m-0"
            >
              {{ title }}
            </div>
            <div
              id="vplocation"
              class="col-2 col-sm-3 text-light align-middle align-self-center text-end"
              @click="drawTooltip(false)"
            >
              <a
                data-bs-toggle="collapse"
                href="#"
                data-bs-target="#collapse-right"
                role="button"
                class="text-light text-center align-baseline align-self-center h6 p-0 d-none d-sm-inline"
                style="text-decoration: none; display: none !important;"
              >
                View Location
                <i class="fa-solid fa-chevron-right"></i>
              </a>
            </div>
          </div>
          <div class="row" id="opttionRow">
            <div class="col-6 text-center p-0 h2 text-light" id="optionA">
              <div id="dropdownA" class="dropdown p-0 m-0">
                <button
                  class="items btn btn-secondary dropdown-toggle rounded-0 w-100 border-end px-1 px-sm-2"
                  type="button"
                  id="dropdownMenuButton1"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  Existing View
                </button>

                <ul
                  class="dropdown-menu w-100 mt-0"
                  aria-labelledby="dropdownMenuButton1"
                >
                  <li class="">
                    <a
                      v-cloak
                      v-for="(item, index) in options"
                      :key="index"
                      class="items dropdown-item my-1"
                      href="#"
                      @click="optionClicked($event,index,false)"
                      >{{item}}</a
                    >
                  </li>
                </ul>
              </div>
            </div>
            <div class="col-6 text-center px-0 h2 text-light" id="optionB">
              <div id="dropdownB" class="dropdown px-0 m-0">
                <button
                  class="items btn btn-secondary dropdown-toggle rounded-0 w-100 border-start px-1 px-sm-2"
                  type="button"
                  id="dropdownMenuButton2"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  Existing View
                </button>
                <ul
                  class="dropdown-menu w-100"
                  aria-labelledby="dropdownMenuButton2"
                >
                  <li>
                    <a
                      v-cloak
                      v-for="(item, index) in options"
                      :key="index"
                      class="items dropdown-item my-1"
                      href="#"
                      @click="optionClicked($event,index,true)"
                      >{{item}}</a
                    >
                  </li>
                </ul>
              </div>
            </div>
          </div>
          <div
            class="row flex-grow-1"
            id="imageRow"
            style="min-height: 0 !important"
          >
            <div
              class="col text-center p-0 m-0 h2 text-light"
              style="min-height: 0 !important"
            >
              <div id="image-compare" class="" style="min-height: 0 !important">
                <img class="" id="img1" src="" alt="" />
                <img class="" id="img2" src="" alt="" />
              </div>
            </div>
          </div>
        </div>
        <!-- collapse right -->
        <div
          id="collapse-right"
          class="col-sm-4 sidebar collapse collapse-horizontal p-0"
          data-bs-parent="#main"
        >
          <div class="w-100 pe-3 pt-0 vh-100">
            <!-- map of the view location -->
            <!-- make a element arranged before the div -->
            <div class="title" style="display: inline-block;"></div>
            <div class="text-center my-2 text-white h5" style="padding: 2px 0px 1px 0px">
              {{mapLocation}}
            </div>
            <img id="mapImage" class="p-0" src="" alt="" />
          </div>
        </div>
        <div
          id="mobileSidebar"
          class="sidebar mobile col-12 d-block d-sm-none p-0 h-100"
        >
          <div class="w-100 pe-0 pt-0 h-100 d-flex flex-column">
            <p
              class="text-light text-center align-baseline align-self-center py-1 m-0"
              style="font-size: 16px"
            >
              Mitigation Measures
            </p>
            <div class="bg-light rounded-1 overflow-scroll" style="height: 40%">
              <ul
                class="list-group list-group-flush list-group-numbered bg-opacity-0 h-auto"
              >
                <li
                  v-cloak
                  v-for="(item, index) in items"
                  :key="index"
                  class="list-group-item"
                >
                  {{item.content}}
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
