<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noise Selection</title>
    <style>
      * {
        user-select: none;
      }

      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: transparent;
        overflow: hidden;
      }
      .container {
        width: 100vw;
        min-height: fit-content;
        max-height: 90vh;
        background-color: rgba(255, 255, 255, 0.85);
        border-radius: 2.5vw 2.5vw 2.5vw 2.5vw;
        padding: 0px;
        text-align: center;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      header {
        width: 100%;
        height: 13.75vw;
        display: flex;
        background-color: #005555; /* Dark green */
        color: white;
        text-align: left;
        padding: 0;
        align-items: center;
      }
      #panelTitle {
        padding: 0 0 0 5vw;
        font-size: 8vw;
        width: 100%;
        height: 100%;
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: flex;
        align-items: center;
      }

      #closeCon {
        display: flex;
        height: 100%;
        width: 13.75vw;
        cursor: pointer;
        margin: 0px 0px 0px auto;
        padding: 0px;
        background-color: #005555;
        align-items: center;
        justify-content: center;
      }
      #closeCon:hover {
        background-color: #003838;
      }

      #close {
        font-size: 17vw !important;
        padding: 0 !important;
      }
      #titleCon {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 22vw;
        padding: 4vw 4vw 4vw 4vw;
        overflow: hidden;
      }

      #title {
        font-size: 9vw;
        text-align: center;
        vertical-align: middle;
        margin: 0;

        /* background-color: #8af678; */
      }

      #instruction {
        font-size: 5vw;
        margin: 0;
        padding-top: 0;
      }

      .button {
        display: block;
        width: 80%;
        margin: 1.5vw auto;
        padding: 2.7vw;
        text-align: center;
        font-size: 7vw;
        font-weight: bold;
        cursor: pointer;
        color: rgb(0, 0, 0);
        border: #004d40 solid 3px;
        background: none;
      }
      .selected {
        background-color: #004d40; /* Dark green */
        border: #004d40 solid 3px;
        color: white !important;
      }

      #bottomContainer {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding-bottom: 8vw;
        width: 100%;
      }

      .legend {
        display: none;
        text-align: left;
        font-size: 4.5vw;
        padding-left: 11vw;
        padding-right: 6vw;
        margin-top: 2vw;
        /* width: 100%; */
      }

      #legendTitle {
        font-weight: 600;
        margin-bottom: 5.5vw !important;
      }

      .legendItems {
        display: flex;
        align-items: center;
        margin-top: 2.7vw;
        /* margin-bottom: 2.7vw; */
        /* width: 90vw; */
      }
      .legendItems .blueLabel {
        font-size: 4.5vw;
        padding-left: 4vw;
        width: 70%;
      }
      .legendItems .yellowLabel {
        font-size: 4.5vw;
        padding-left: 4vw;
        width: 70%;
      }

      .legendItems label {
        flex-grow: 1;
        /* font-size: 16px; */
        padding-left: 4vw;
        /* background-color: #8af678; */
      }

      .legendIcon {
        /* display: block; */
        width: 7vw !important;
        height: 7vw;
        /* margin-right: 4vw; */
        /* padding-right: 4vw; */
      }
      .complied {
        background-color: #3eff50; /* light green */
      }
      .exceeded {
        background-color: #ff0000; /* light red */
      }

      .blue {
        background-color: #005aff; /* light red */
      }

      .yellow {
        background-color: #ffd700; /* light red */
      }

      .lightGreen {
        background-color: #98fb98; /* light green */
      }

      .noiseBarrier .legendIcon {
        background-color: #b636ff; /* purple for noise barrier */
      }

      hr {
        width: 80%;
        margin-top: 4vw;
        margin-bottom: 3vw;
        height: 1px;
        background-color: #c5c5c5a8;
        border: none;
      }

      .blue1 {
        /* display: none; */
      }

      .yellow1 {
        display: none;
      }

      .red1LabelShowWhenMitigated {
        display: none;
      }
      .red1LabelShowWhenUnmitigated {
        display: none;
      }

      .noiseBarrierLabel {
        font-size: 4.5vw;
        padding-left: 4vw;
        width: 70%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header id="header">
        <span id="panelTitle">Noise</span>
        <div id="closeCon" onclick="closePanel()">
          <span id="close">&times;</span>
        </div>
      </header>
      <div id="titleCon"><h2 id="title">Title</h2></div>

      <div id="bottomContainer">
        <p id="instruction">Click below to select a scenario</p>
        <button
          id="mitigatedBtn"
          class="button mitigated selected"
          onclick="mitigatedFunction()"
        >
          Mitigated
        </button>
        <button
          id="unmitigatedBtn"
          class="button unmitigated"
          onclick="unmitigatedFunction()"
        >
          Unmitigated
        </button>
        <button
          id="PrevailingBtn"
          class="button unmitigated"
          onclick="prevailedFunction()"
          style="display: none"
        >
          Prevailing
        </button>
        <hr />
        <div class="legend">
          <div id="legendTitle">Legend</div>
          <div class="legendItems green">
            <span class="complied legendIcon"></span>
            <label>Complied with the criteria*</label>
          </div>
          <div class="legendItems red">
            <span class="exceeded legendIcon"></span>
            <label>Exceeded the criteria*</label>
          </div>
          <div class="legendItems red1" style="display: none">
            <span class="exceeded legendIcon"></span>
            <label class="red1LabelShowWhenMitigated"
              >Exceeded the criteria*</label
            >
            <label class="red1LabelShowWhenUnmitigated"
              >Exceeded the criteria*</label
            >
          </div>
          <div class="legendItems blue1">
            <span class="blue legendIcon"></span>
            <label class="blueLabel"
              >Complied with the criteria# (with acoustic
              windows/balconies)</label
            >
          </div>
          <div class="legendItems noiseBarrier" style="display: none">
            <span class="legendIcon"></span>
            <label class="noiseBarrierLabel"
              >Complied with the criteria# (with acoustic windows/balconies lined
              with sound absorptive material)</label
            >
          </div>
          <div class="legendItems lightGreen1" style="display: none">
            <span class="lightGreen legendIcon"></span>
            <label
              class="lightGreenLabel"
              style="font-size: 4vw; padding-left: 4vw; width: 70%"
              >Existing low noise road surfacing</label
            >
          </div>
          <div class="legendItems yellow1">
            <span class="yellow legendIcon"></span>
            <label class="yellowLabel"
              >Proposed low noise road surfacing
            </label>
          </div>
          <div class="remark" style="font-size: 3vw; margin-top: 2vw">
            <label
              >Remarks : <br />
              *L10 (1 hour): 70 dB(A) for residential; 65 dB(A) for educational
              institution <br> #Project roads contribute less than 1dB(A) to the overall noise level
            </label>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Get the parameter title from the url
      let panelType = "";
      const urlParams = new URLSearchParams(window.location.search);
      let panelParams = urlParams.get("panel");
      let legend;
      let originalTitle = ""; // Variable to store the original title
      if (panelParams) {
        panelType = panelParams;
      }

      //function to toggle the button
      function toggleButton(btn) {
        //get the button element
        var button = document.getElementById(btn + "Btn");
        //check if the button is selected
        if (button.classList.contains("selected")) {
          //remove the selected class
          // button.classList.remove("selected");
        } else {
          //remove the selected class from all buttons
          document.querySelectorAll(".button").forEach((btn) => {
            btn.classList.remove("selected");
          });
          //add the selected class to the button
          button.classList.add("selected");
        }
      }

      function changeTitle() {
        // Get the parameter title from the url
        const urlParams = new URLSearchParams(window.location.search);
        let title = urlParams.get("title");
        let scenario = urlParams.get("scenario");

        // If title is not null then change the title of the page
        if (title) {
          // Replace ~ symbol with HTML line break
          title = title.replace(/~/g, "<br>");
          document.getElementById("title").innerHTML = title;
          // Store the original title for later use
          originalTitle = title;
        }
      }

      function setTitleSize() {
        //get parameter from url and set the title size
        const urlParams = new URLSearchParams(window.location.search);
        const titleSize = urlParams.get("titleSize");
        if (titleSize) {
          document.getElementById("title").style.fontSize = titleSize;
        }
      }

      //>> function to change the Panel name
      function changePanelName() {
        // Get the parameter title from the url
        const urlParams = new URLSearchParams(window.location.search);
        let panelName = urlParams.get("panel");
        let scenario = urlParams.get("scenario");
        // If title is not null then change the title of the page
        if (panelName) {
          // Replace ~ symbol with HTML line break
          panelName = panelName;
          document.getElementById("panelTitle").innerHTML = panelName;
          // Check if panelName is "Road Traffic Noise" and trigger unmitigatedFunction after 0.5 seconds
          // But only if "nomiti" is not in the scenario parameter to avoid conflicts
          if (
            panelName === "Road Traffic Noise" &&
            (!scenario || !scenario.includes("nomiti"))
          ) {
            setTimeout(unmitigatedFunction, 500);
          }
        }
      }
      changePanelName();

      //>> function to change the legend
      function changeLegend() {
        // Get the parameter title from the url
        const urlParams = new URLSearchParams(window.location.search);
        legends = urlParams.get("legend");

        // Split the legends string by commas to get an array
        if (legends) {
          legends = legends.split(",");

          legends.forEach((legend) => {
            if (legend === "blue1") {
              // Make the blue legend visible
              document.querySelector(".blue1").style.display = "flex";
            }
            if (legend === "yellow1") {
              // Make the yellow legend visible
              document.querySelector(".yellow1").style.display = "flex";
            }
            if (legend === "nored") {
              // Hide the red legend
              document.querySelector(".red").style.display = "none";
            }

            if (legend === "yellow_green") {
              // Show both lightGreen and yellow1 legends
              document.querySelector(".lightGreen1").style.display = "flex";
              document.querySelector(".yellow1").style.display = "flex";
            }
          });
        }

        let panelName = urlParams.get("panel");
        //if the panel name is Road Traffic Noise, then hide the red legend and display the red1 legend
      }
      changeLegend();
      changeTitle();
      setTitleSize();

      //change scenario
      function changeScenario() {
        // Get the parameter title from the url
        const urlParams = new URLSearchParams(window.location.search);
        let scenario = urlParams.get("scenario");
        if (scenario) {
          // Split the scenario string by commas to handle multiple values
          let scenarios = scenario.split(",");

          // Check if "prevailed" is in the scenarios array
          if (scenarios.includes("prevailed")) {
            document.getElementById("PrevailingBtn").style.display = "block";
          } else {
            document.getElementById("PrevailingBtn").style.display = "none";
          }

          // Check if "nomiti" is in the scenarios array
          if (scenarios.includes("nomiti")) {
            document.getElementById("mitigatedBtn").style.display = "none";
            document.getElementById("unmitigatedBtn").style.display = "none";

            // Auto-click the Prevailing button if it's visible
            if (scenarios.includes("prevailed")) {
              setTimeout(() => {
                prevailedFunction();
              }, 100);
            }
          } else {
            document.getElementById("mitigatedBtn").style.display = "block";
            document.getElementById("unmitigatedBtn").style.display = "block";
          }
        }

        // Broadcast legend flags to parent so the EIA page can mirror conditional rows
        try {
          window.parent.postMessage({ type: 'noiseLegendFlags', flags: legends || [] }, '*');
        } catch (e) {}
      }
      changeScenario();

      //>> 3dv

      let rp = window.parent.tour._getRootPlayer();
      function mitigatedFunction() {
        // var rp = window.parent.tour._getRootPlayer();
        document.getElementById("mitigatedBtn").classList.add("selected");
        document.getElementById("unmitigatedBtn").classList.remove("selected");
        document.getElementById("PrevailingBtn").classList.remove("selected");

        // Restore original title
        if (originalTitle) {
          document.getElementById("title").innerHTML = originalTitle;
        }

        if (panelType == "Marine Traffic Noise") {
          MySetVizByTags(["MarineNoise_Mitigated"], false, 0);
          MySetVizByTags(["MarineNoise_Unmitigated"], false, 0);
          MySetVizByTags(["MarineNoise_Mitigated"], true, 300);
        } else {
          MySetVizByTags(["state_prevailing_noise"], false, 0);
          MySetVizByTags(["Noise_Mitigated"], false, 0);
          MySetVizByTags(["Noise_Unmitigated"], false, 0);
          MySetVizByTags(["Noise_Mitigated"], true, 300);
          MySetVizByTags(["state_noise"], true, 300);
        }

        //broadcast message to parent window
        var iframes = window.parent.frames;
        for (var i = 0; i < iframes.length; i++) {
          iframes[i].postMessage("mitigated", "*");
        }
        // also notify parent (tour page) directly
        try { window.parent.postMessage("mitigated", "*"); } catch (e) {}

        // Show/hide labels
        document.querySelector(".red1LabelShowWhenMitigated").style.display =
          "block";
        document.querySelector(".red1LabelShowWhenUnmitigated").style.display =
          "none";

        // Show yellow1 legend if it exists in URL params
        if (legends && legends.includes("yellow_green")) {
          document.querySelector(".yellow1").style.display = "flex";
          document.querySelector(".lightGreen1").style.display = "flex";
        }

        // Show blue1 legend
        document.querySelector(".blue1").style.display = "flex";

        // Show noise barrier legend
        document.querySelector(".noiseBarrier").style.display = "flex";
      }

      function unmitigatedFunction() {
        // var rp = window.parent.tour._getRootPlayer();
        document.getElementById("unmitigatedBtn").classList.add("selected");
        document.getElementById("mitigatedBtn").classList.remove("selected");
        document.getElementById("PrevailingBtn").classList.remove("selected");

        // Restore original title
        if (originalTitle) {
          document.getElementById("title").innerHTML = originalTitle;
        }

        if (panelType == "Marine Traffic Noise") {
          MySetVizByTags(["MarineNoise_Unmitigated"], false, 0);
          MySetVizByTags(["MarineNoise_Mitigated"], false, 0);
          MySetVizByTags(["MarineNoise_Unmitigated"], true, 300);
        } else {
          MySetVizByTags(["state_prevailing_noise"], false, 0);
          MySetVizByTags(["Noise_Unmitigated"], false, 0);
          MySetVizByTags(["Noise_Mitigated"], false, 0);
          MySetVizByTags(["Noise_Unmitigated"], true, 300);
          MySetVizByTags(["state_noise"], true, 300);
        }

        //broadcast message to parent window
        var iframes = window.parent.frames;
        for (var i = 0; i < iframes.length; i++) {
          iframes[i].postMessage("unmitigated", "*");
        }
        // also notify parent (tour page) directly
        try { window.parent.postMessage("unmitigated", "*"); } catch (e) {}

        // Show/hide labels
        document.querySelector(".red1LabelShowWhenMitigated").style.display =
          "none";
        document.querySelector(".red1LabelShowWhenUnmitigated").style.display =
          "block";

        // Hide yellow1 legend
        document.querySelector(".yellow1").style.display = "none";
        document.querySelector(".lightGreen1").style.display = "none";

        // Hide blue1 legend
        document.querySelector(".blue1").style.display = "none";

        // Hide noise barrier legend
        document.querySelector(".noiseBarrier").style.display = "none";
      }

      //>> prevailedFunction
      function prevailedFunction() {
        // var rp = window.parent.tour._getRootPlayer();
        document.getElementById("mitigatedBtn").classList.remove("selected");
        document.getElementById("unmitigatedBtn").classList.remove("selected");
        document.getElementById("PrevailingBtn").classList.add("selected");

        // Change title to prevailTitle if it exists
        const urlParams = new URLSearchParams(window.location.search);
        let prevailTitle = urlParams.get("prevailTitle");
        if (prevailTitle) {
          // Replace ~ symbol with HTML line break
          prevailTitle = prevailTitle.replace(/~/g, "<br>");
          document.getElementById("title").innerHTML = prevailTitle;
        }

        if (panelType == "Marine Traffic Noise") {
          MySetVizByTags(["Noise_Mitigated"], false, 0);
          MySetVizByTags(["Noise_Unmitigated"], false, 0);
          MySetVizByTags(["state_noise"], false, 0);
          MySetVizByTags(["state_prevailing_noise"], true, 300);
        } else {
          MySetVizByTags(["Noise_Mitigated"], false, 0);
          MySetVizByTags(["Noise_Unmitigated"], false, 0);
          MySetVizByTags(["state_noise"], false, 0);
          MySetVizByTags(["state_prevailing_noise"], true, 400);
        }

        //broadcast message to parent window
        var iframes = window.parent.frames;
        for (var i = 0; i < iframes.length; i++) {
          iframes[i].postMessage("prevailed", "*");
        }
        // also notify parent (tour page) directly
        try { window.parent.postMessage("prevailed", "*"); } catch (e) {}

        // Hide blue1 legend
        document.querySelector(".blue1").style.display = "none";

        // Hide noise barrier legend
        document.querySelector(".noiseBarrier").style.display = "none";
      }

      function autoSelectedBtn() {
        //auto make the button selected when receiving message
        window.addEventListener("message", function (event) {
          if (event.data == "mitigated") {
            //make the mitigated button with selected class
            document.getElementById("mitigatedBtn").classList.add("selected");
            document
              .getElementById("unmitigatedBtn")
              .classList.remove("selected");
            document
              .getElementById("PrevailingBtn")
              .classList.remove("selected");
            //red1
            document.querySelector(
              ".red1LabelShowWhenMitigated"
            ).style.display = "block";
            document.querySelector(
              ".red1LabelShowWhenUnmitigated"
            ).style.display = "none";
            // Show yellow1 legend if it exists in URL params
            if (legends && legends.includes("yellow1")) {
              document.querySelector(".yellow1").style.display = "flex";
            }
            // Show blue1 legend
            document.querySelector(".blue1").style.display = "flex";
            // Show noise barrier legend
            document.querySelector(".noiseBarrier").style.display = "flex";
            // Restore original title
            if (originalTitle) {
              document.getElementById("title").innerHTML = originalTitle;
            }
          } else if (event.data == "unmitigated") {
            //make the unmitigated button with selected class
            document.getElementById("unmitigatedBtn").classList.add("selected");
            document
              .getElementById("mitigatedBtn")
              .classList.remove("selected");
            document
              .getElementById("PrevailingBtn")
              .classList.remove("selected");
            //red1
            document.querySelector(
              ".red1LabelShowWhenMitigated"
            ).style.display = "none";
            document.querySelector(
              ".red1LabelShowWhenUnmitigated"
            ).style.display = "block";
            // Hide yellow1 legend
            document.querySelector(".yellow1").style.display = "none";
            // Hide blue1 legend
            document.querySelector(".blue1").style.display = "none";
            // Hide noise barrier legend
            document.querySelector(".noiseBarrier").style.display = "none";
            // Restore original title
            if (originalTitle) {
              document.getElementById("title").innerHTML = originalTitle;
            }
          } else if (event.data == "prevailed") {
            document.getElementById("PrevailingBtn").classList.add("selected");
            document
              .getElementById("mitigatedBtn")
              .classList.remove("selected");
            document
              .getElementById("unmitigatedBtn")
              .classList.remove("selected");
            // Hide blue1 legend
            document.querySelector(".blue1").style.display = "none";
            // Hide noise barrier legend
            document.querySelector(".noiseBarrier").style.display = "none";
            // Change title to prevailTitle if it exists
            const urlParams = new URLSearchParams(window.location.search);
            let prevailTitle = urlParams.get("prevailTitle");
            if (prevailTitle) {
              // Replace ~ symbol with HTML line break
              prevailTitle = prevailTitle.replace(/~/g, "<br>");
              document.getElementById("title").innerHTML = prevailTitle;
            }
          }
        });
      }
      autoSelectedBtn();

      function closePanel() {
        MySetVizByTags(["btm_map"], false, 0);

        // var rp = window.parent.tour._getRootPlayer();
        MySetVizByTags(["switch_state_noise"], false, 0);
        MySetVizByTags(["switch_state_air"], false), 0;
        rp.getComponentByName("NoiseStateSwitch").set("visible", false);
        rp.getComponentByName("AirStateSwitch").set("visible", false);
        rp.getComponentByName("MarineNoiseStateSwitch").set("visible", false);
        console.log("[noise/index.html] closePanel called");

        // Directly call the function in tour.vue to hide state_0_air tag
        // This bypasses the middle iframe: noise/index.html -> tour.vue
        try {
          if (window.parent && window.parent.parent && typeof window.parent.parent.hideTagFromPanel === 'function') {
            console.log("[noise/index.html] Calling hideTagFromPanel in tour.vue");
            window.parent.parent.hideTagFromPanel("state_0_air");
          } else {
            console.error("[noise/index.html] hideTagFromPanel function not found on window.parent.parent");
          }
        } catch (error) {
          console.error("[noise/index.html] Error calling hideTagFromPanel:", error);
        }
      }

      function MySetVizByTags(tags, visibility, delay) {
        // var rp = window.parent.tour._getRootPlayer();
        rp.setOverlaysVisibilityByTags(
          tags,
          visibility,
          rp.getMediaByName(),
          "or",
          delay
        );
      }
    </script>
  </body>
</html>
