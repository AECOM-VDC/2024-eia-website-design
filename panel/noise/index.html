<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noise Selection</title>
    <style>
      * {
        user-select: none;
      }

      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: transparent;
        overflow: hidden;
      }
      .container {
        width: 100vw;
        min-height: fit-content;
        max-height: 90vh;
        background-color: rgba(255, 255, 255, 0.85);
        border-radius: 2.5vw 2.5vw 2.5vw 2.5vw;
        padding: 0px;
        text-align: center;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      header {
        width: 100%;
        height: 13.75vw;
        display: flex;
        background-color: #005555; /* Dark green */
        color: white;
        text-align: left;
        padding: 0;
        align-items: center;
      }
      #panelTitle {
        padding: 0 0 0 5vw;
        font-size: 8vw;
        width: 100%;
        height: 100%;
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: flex;
        align-items: center;
      }

      #closeCon {
        display: flex;
        height: 100%;
        width: 13.75vw;
        cursor: pointer;
        margin: 0px 0px 0px auto;
        padding: 0px;
        background-color: #005555;
        align-items: center;
        justify-content: center;
      }
      #closeCon:hover {
        background-color: #003838;
      }

      #close {
        font-size: 17vw !important;
        padding: 0 !important;
      }
      #titleCon {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 22vw;
        padding: 4vw 4vw 4vw 4vw;
        overflow: hidden;
      }

      #title {
        font-size: 9vw;
        text-align: center;
        vertical-align: middle;
        margin: 0;

        /* background-color: #8af678; */
      }

      #instruction {
        font-size: 5vw;
        margin: 0;
        padding-top: 0;
      }

      .button {
        display: block;
        width: 80%;
        margin: 1.5vw auto;
        padding: 2.7vw;
        text-align: center;
        font-size: 7vw;
        font-weight: bold;
        cursor: pointer;
        color: rgb(0, 0, 0);
        border: #004d40 solid 3px;
        background: none;
      }
      .selected {
        background-color: #004d40; /* Dark green */
        border: #004d40 solid 3px;
        color: white !important;
      }

      #bottomContainer {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding-bottom: 8vw;
        width: 100%;
      }

      .legend {
        display: none;
        text-align: left;
        font-size: 4.5vw;
        padding-left: 11vw;
        padding-right: 6vw;
        margin-top: 2vw;
        /* width: 100%; */
      }

      #legendTitle {
        font-weight: 600;
        margin-bottom: 5.5vw !important;
      }

      .legendItems {
        display: flex;
        align-items: center;
        margin-top: 2.7vw;
        /* margin-bottom: 2.7vw; */
        /* width: 90vw; */
      }
      .legendItems .blueLabel {
        font-size: 4.5vw;
        padding-left: 4vw;
        width: 70%;
      }
      .legendItems .yellowLabel {
        font-size: 4.5vw;
        padding-left: 4vw;
        width: 70%;
      }

      .legendItems label {
        flex-grow: 1;
        /* font-size: 16px; */
        padding-left: 4vw;
        /* background-color: #8af678; */
      }

      .legendIcon {
        /* display: block; */
        width: 7vw !important;
        height: 7vw;
        /* margin-right: 4vw; */
        /* padding-right: 4vw; */
      }
      .complied {
        background-color: #3eff50; /* light green */
      }
      .exceeded {
        background-color: #ff0000; /* light red */
      }

      .blue {
        background-color: #005aff; /* light red */
      }

      .yellow {
        background-color: #ffd700; /* light red */
      }

      .lightGreen {
        background-color: #98fb98; /* light green */
      }

      .noiseBarrier .legendIcon {
        background-color: #b636ff; /* purple for noise barrier */
      }

      hr {
        width: 80%;
        margin-top: 4vw;
        margin-bottom: 3vw;
        height: 1px;
        background-color: #c5c5c5a8;
        border: none;
      }

      /* Legend item visibility is controlled by updateLegend() */

      .noiseBarrierLabel {
        font-size: 4.5vw;
        padding-left: 4vw;
        width: 70%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header id="header">
        <span id="panelTitle">Noise</span>
        <div id="closeCon" onclick="closePanel()">
          <span id="close">&times;</span>
        </div>
      </header>
      <div id="titleCon"><h2 id="title">Title</h2></div>

      <div id="bottomContainer">
        <p id="instruction">Click below to select a scenario</p>
        <button
          id="mitigatedBtn"
          class="button selected"
          onclick="mitigatedFunction()"
        >
          Mitigated
        </button>
        <button
          id="unmitigatedBtn"
          class="button"
          onclick="unmitigatedFunction()"
        >
          Unmitigated
        </button>
        <button id="PrevailingBtn" class="button" onclick="prevailedFunction()">
          Prevailing
        </button>
        <button id="WPAYBtn" class="button" onclick="wpayFunction()">
          Without Project at Assessment Year
        </button>
        <hr />
        <div class="legend">
          <div id="legendTitle">Legend</div>
          <div class="legendItems" data-legend="green">
            <span class="complied legendIcon"></span>
            <label>Complied with the criteria*</label>
          </div>
          <div class="legendItems" data-legend="red">
            <span class="exceeded legendIcon"></span>
            <label>Exceeded the criteria*</label>
          </div>
          <div class="legendItems" data-legend="blue1">
            <span class="blue legendIcon"></span>
            <label class="blueLabel"
              >Complied with the criteria# (with acoustic
              windows/balconies)</label
            >
          </div>
          <div class="legendItems" data-legend="noiseBarrier">
            <span class="legendIcon" style="background-color: #b636ff"></span>
            <label class="noiseBarrierLabel"
              >Complied with the criteria# (with acoustic windows/balconies
              lined with sound absorptive material)</label
            >
          </div>
          <div class="legendItems" data-legend="lightGreen1">
            <span class="lightGreen legendIcon"></span>
            <label
              class="lightGreenLabel"
              style="font-size: 4vw; padding-left: 4vw; width: 70%"
              >Existing low noise road surfacing</label
            >
          </div>
          <div class="legendItems" data-legend="yellow1">
            <span class="yellow legendIcon"></span>
            <label class="yellowLabel"
              >Proposed low noise road surfacing
            </label>
          </div>
          <div class="remark" style="font-size: 3vw; margin-top: 2vw">
            <label
              >Remarks : <br />
              *L10 (1 hour): 70 dB(A) for residential; 65 dB(A) for educational
              institution <br />
              #Project roads contribute less than 1dB(A) to the overall noise
              level
            </label>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Get the parameter title from the url
      const ENABLE_LEGEND = false;
      let panelType = "";
      const urlParams = new URLSearchParams(window.location.search);
      let panelParams = urlParams.get("panel");
      let legend;
      let originalTitle = ""; // Variable to store the original title
      if (panelParams) {
        panelType = panelParams;
      }

      const noPrevailList = [
        "NSW293_5a",
        "NSW293_6a",
        "LSPS1a",
        "LSPS1b",
        "SP1",
        "SP2a",
        "SP5",
        "SP6",
        "NSW9_3b",
        "NSW8_1b",
        "NSW8_2b",
      ];

      // Hide PrevailingBtn if title contains any item in the noPrevailList
      let initialTitle = urlParams.get("title");
      if (initialTitle) {
        let shouldHidePrevail = noPrevailList.some((item) =>
          initialTitle.includes(item),
        );
        if (shouldHidePrevail) {
          let prevailingBtn = document.getElementById("PrevailingBtn");
          if (prevailingBtn) {
            prevailingBtn.style.display = "none";
          }
        }
      }

      //function to toggle the button
      function toggleButton(btn) {
        //get the button element
        var button = document.getElementById(btn + "Btn");
        //check if the button is selected
        if (button.classList.contains("selected")) {
          //remove the selected class
          // button.classList.remove("selected");
        } else {
          //remove the selected class from all buttons
          document.querySelectorAll(".button").forEach((btn) => {
            btn.classList.remove("selected");
          });
          //add the selected class to the button
          button.classList.add("selected");
        }
      }

      function changeTitle() {
        // Get the parameter title from the url
        const urlParams = new URLSearchParams(window.location.search);
        let title = urlParams.get("title");
        let scenario = urlParams.get("scenario");

        // If title is not null then change the title of the page
        if (title) {
          // Replace ~ symbol with HTML line break
          title = title.replace(/~/g, "<br>");
          document.getElementById("title").innerHTML = title;
          // Store the original title for later use
          originalTitle = title;
        }
      }

      function setTitleSize() {
        //get parameter from url and set the title size
        const urlParams = new URLSearchParams(window.location.search);
        const titleSize = urlParams.get("titleSize");
        if (titleSize) {
          document.getElementById("title").style.fontSize = titleSize;
        }
      }

      //>> function to change the Panel name
      function changePanelName() {
        const urlParams = new URLSearchParams(window.location.search);
        let panelName = urlParams.get("panel");
        if (panelName) {
          document.getElementById("panelTitle").innerHTML = panelName;
        }
      }
      changePanelName();

      //>> Legend configuration per scenario
      //   Each key lists which data-legend items to show for that scenario.
      //   URL ?legend= param can extend the defaults at init time.
      const legendConfig = {
        mitigated: ["green", "red"],
        unmitigated: ["green", "red"],
        prevailed: ["green", "red"],
        wpay: ["green", "red"],
      };

      // Apply URL ?legend= overrides to the config
      (function applyLegendOverrides() {
        const urlLegend = urlParams.get("legend");
        if (!urlLegend) return;
        const flags = urlLegend.split(",");

        if (flags.includes("yellow_green")) {
          legendConfig.mitigated.push("yellow1", "lightGreen1");
        }
        if (flags.includes("yellow1")) {
          legendConfig.mitigated.push("yellow1");
        }
        if (flags.includes("nored")) {
          Object.keys(legendConfig).forEach((key) => {
            legendConfig[key] = legendConfig[key].filter((i) => i !== "red");
          });
        }
      })();

      /**
       * Show/hide legend items based on the active scenario.
       * Reads from legendConfig — the single source of truth.
       */
      function updateLegend(scenario) {
        if (!ENABLE_LEGEND) {
          return;
        }
        // Show the legend container
        document.querySelector(".legend").style.display = "block";

        const visible = legendConfig[scenario] || [];

        // Hide all, then show only the ones in config
        document.querySelectorAll("[data-legend]").forEach((el) => {
          el.style.display = visible.includes(el.dataset.legend)
            ? "flex"
            : "none";
        });
      }

      changeTitle();
      setTitleSize();

      // Broadcast legend flags to parent
      try {
        window.parent.postMessage(
          { type: "noiseLegendFlags", flags: Object.keys(legendConfig) },
          "*",
        );
      } catch (e) {}

      //>> 3dv

      let rp;
      try {
        rp = window.parent.tour._getRootPlayer();
      } catch (e) {
        console.warn("rp not found ");
        rp = null;
      }

      // All noise tags — each button maps 1-to-1 to one of these
      const allNoiseTags = [
        "Noise_Mitigated",
        "Noise_Unmitigated",
        "Noise_prevailing",
        "Noise_WPAY",
        "state_noise",
      ];

      const allBtnIds = [
        "mitigatedBtn",
        "unmitigatedBtn",
        "PrevailingBtn",
        "WPAYBtn",
      ];

      /**
       * Generic helper: hide all noise tags, then show only the given tag.
       * Also updates button selection and broadcasts the state.
       */
      function switchScenario(
        activeTags,
        activeBtnId,
        messageKey,
        broadcast = true,
      ) {
        // Update button states
        allBtnIds.forEach((id) =>
          document.getElementById(id).classList.remove("selected"),
        );
        document.getElementById(activeBtnId).classList.add("selected");

        // Hide all noise tags first
        allNoiseTags.forEach((tag) => MySetVizByTags([tag], false, 0));

        // Show active tag(s)
        let tagsToShow = Array.isArray(activeTags) ? activeTags : [activeTags];
        MySetVizByTags(tagsToShow, true, 300);

        // Update legend display
        updateLegend(messageKey);

        if (broadcast) {
          // Broadcast message to sibling iframes
          var iframes = window.parent.frames;
          for (var i = 0; i < iframes.length; i++) {
            iframes[i].postMessage(messageKey, "*");
          }
          // Also notify parent (tour page) directly
          try {
            window.parent.postMessage(messageKey, "*");
          } catch (e) {}
        }
      }

      function mitigatedFunction(broadcast = true) {
        switchScenario(
          ["Noise_Mitigated", "state_noise"],
          "mitigatedBtn",
          "mitigated",
          broadcast,
        );
        if (originalTitle) {
          document.getElementById("title").innerHTML = originalTitle;
        }
      }

      function unmitigatedFunction(broadcast = true) {
        switchScenario(
          ["Noise_Unmitigated", "state_noise"],
          "unmitigatedBtn",
          "unmitigated",
          broadcast,
        );
        if (originalTitle) {
          document.getElementById("title").innerHTML = originalTitle;
        }
      }

      function prevailedFunction(broadcast = true) {
        switchScenario(
          ["Noise_prevailing", "state_prevailing_noise"],
          "PrevailingBtn",
          "prevailed",
          broadcast,
        );
        // Use prevailTitle if provided
        const prevailTitle = urlParams.get("prevailTitle");
        if (prevailTitle) {
          document.getElementById("title").innerHTML = prevailTitle.replace(
            /~/g,
            "<br>",
          );
        }
      }

      function wpayFunction(broadcast = true) {
        switchScenario(
          ["Noise_WPAY", "state_noise"],
          "WPAYBtn",
          "wpay",
          broadcast,
        );
        if (originalTitle) {
          document.getElementById("title").innerHTML = originalTitle;
        }
      }

      // Map message keys to the function that each scenario calls
      const scenarioMap = {
        mitigated: mitigatedFunction,
        unmitigated: unmitigatedFunction,
        prevailed: prevailedFunction,
        wpay: wpayFunction,
      };

      // Auto-sync when receiving messages from sibling panels
      window.addEventListener("message", function (event) {
        // Call scenario function with broadcast=false to prevent feedback loop
        if (scenarioMap[event.data]) {
          scenarioMap[event.data](false);
        }
      });

      // Show legend for the default scenario (Mitigated) on page load
      updateLegend("mitigated");

      function closePanel() {
        // Hide all noise-related overlays
        allNoiseTags.forEach((tag) => MySetVizByTags([tag], false, 0));
        MySetVizByTags(["btm_map"], false, 0);

        MySetVizByTags(["switch_state_noise"], false, 0);
        MySetVizByTags(["switch_state_air"], false, 0);
        try {
          rp.getComponentByName("NoiseStateSwitch").set("visible", false);
          rp.getComponentByName("AirStateSwitch").set("visible", false);
        } catch (e) {}

        // Directly call the function in tour.vue to hide state_0_air tag
        try {
          if (
            window.parent &&
            window.parent.parent &&
            typeof window.parent.parent.hideTagFromPanel === "function"
          ) {
            window.parent.parent.hideTagFromPanel("state_0_air");
          }
        } catch (error) {
          // Silent fail
        }
      }

      function MySetVizByTags(tags, visibility, delay) {
        if (!rp) return; // Skip in local preview mode
        rp.setOverlaysVisibilityByTags(
          tags,
          visibility,
          rp.getMediaByName(),
          "or",
          delay,
        );
      }
    </script>
  </body>
</html>
