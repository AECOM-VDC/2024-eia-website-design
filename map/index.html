      /* Styles for the pop-up iframe and close button */
      #lvi-popup {
        display: none;
        position: fixed !important;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 80%;
        height: 80%;
        border: 2px solid #000;
        z-index: 1000;

      #lvi-popup iframe {

      #close-popup {
        background-color: aliceblue;
        display: block;
        text-align: right;
        padding: 10px;
        cursor: pointer;
